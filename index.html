<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoTrack Fleet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>EcoTrack Fleet</h1>
        <p>Seguimiento de camiones de recolección</p>
      </div>
      <div class="status-pill">Turno mañana · Operación activa</div>
    </header>

    <main class="layout">
      <section class="map-card">
        <h2>Mapa operativo (simulado)</h2>
        <div id="map-grid" class="map-grid" aria-label="Mapa de operación"></div>
      </section>

      <aside class="alerts-card">
        <h2>Alertas de desviación</h2>
        <ul id="alerts-list" class="alerts-list"></ul>
      </aside>
    </main>

    <section class="kpi-grid" id="kpi-grid"></section>

    <section class="table-card">
      <h2>Estado de flota</h2>
      <table>
        <thead>
          <tr>
            <th>Unidad</th>
            <th>Conductor</th>
            <th>Ruta</th>
            <th>Estado</th>
            <th>Última actualización</th>
          </tr>
        </thead>
        <tbody id="fleet-body"></tbody>
      </table>
    </section>

    <script src="app.js"></script>
  </body>
</html>
